# CentFlow — Supabase local config
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "centflow"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["centflow://**", "exp://**"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.process-receipt]
verify_jwt = true

[functions.send-email]
verify_jwt = true

[functions.email-jobs]
verify_jwt = false

[functions.gocardless]
verify_jwt = true
