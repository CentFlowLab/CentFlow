# Produção. Não contém credenciais. O staging não está ligado aqui.
# Esta secção de auth é a proposta. Não foi aplicada: não correr `config push`
# sem autorização. Os segredos ficam em variáveis de ambiente, nunca neste ficheiro.
project_id = "slfgslfzolfvqavuccom"

[auth]
# Origem pública: miven.pt. Não foi aplicada no painel. Não correr `config push`.
site_url = "https://miven.pt"
# URLs exatas, com e sem www. O esquema nativo é o da app.
additional_redirect_urls = [
  "miven://auth/callback",
  "miven://auth/reset-password",
  "https://miven.pt/auth/callback",
  "https://miven.pt/auth/reset-password",
  "https://www.miven.pt/auth/callback",
  "https://www.miven.pt/auth/reset-password",
]
enable_signup = true
# Igual ao mínimo pedido no ecrã (8). O servidor recusa abaixo disto com weak_password.
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
# O correio integrado do Supabase limita o ritmo; com SMTP próprio pode ser mais curto.
max_frequency = "1m"

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "env(RESEND_FROM_EMAIL)"
sender_name = "Miven"

# A função confirma a sessão com `auth.getUser()`; o JWT da plataforma bloqueia o OPTIONS da web.
# O CORS permitido está no código (origins locais + ALLOWED_WEB_ORIGINS). Não voltar a usar `*`.
[functions.delete-account]
verify_jwt = false

[functions.suggest-entry]
verify_jwt = false
