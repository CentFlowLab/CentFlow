# Produção. Não contém credenciais. O staging não está ligado aqui.
# Esta secção de auth é a proposta. Não foi aplicada: não correr `config push`
# sem autorização. Os segredos ficam em variáveis de ambiente, nunca neste ficheiro.
project_id = "slfgslfzolfvqavuccom"

[auth]
# Origem pública: miven.pt. Não foi aplicada no painel. Não correr `config push`.
site_url = "https://miven.pt"
# URLs exatas, com e sem www. O esquema nativo é o da app. A app web vive em /app.
# centflow:// fica para as builds antigas já autorizadas no servidor.
additional_redirect_urls = [
  "centflow://auth/callback",
  "centflow://auth/reset-password",
  "miven://auth/callback",
  "miven://auth/reset-password",
  "https://miven.pt/auth/callback",
  "https://miven.pt/auth/reset-password",
  "https://miven.pt/app/auth/callback",
  "https://miven.pt/app/auth/reset-password",
  "https://www.miven.pt/auth/callback",
  "https://www.miven.pt/auth/reset-password",
  "https://www.miven.pt/app/auth/callback",
  "https://www.miven.pt/app/auth/reset-password",
]
enable_signup = true
# Igual ao mínimo pedido no ecrã (8). O servidor recusa abaixo disto com weak_password.
minimum_password_length = 8

[auth.email]
enabled = true
enable_confirmations = true
# O correio integrado do Supabase limita o ritmo; com SMTP próprio pode ser mais curto.
max_frequency = "1m"

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "env(RESEND_FROM_EMAIL)"
sender_name = "Miven"

# O assunto escolhe a língua. O link leva o token_hash para a app confirmar em qualquer dispositivo.
[auth.email.template.confirmation]
subject = "{{ $l := or .Data.locale \"pt\" }}{{ if eq $l \"en\" }}Confirm your email for Miven{{ else if eq $l \"es\" }}Confirma tu email en Miven{{ else }}Confirma o teu email no Miven{{ end }}"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "{{ $l := or .Data.locale \"pt\" }}{{ if eq $l \"en\" }}Reset your Miven password{{ else if eq $l \"es\" }}Restablece tu contraseña de Miven{{ else }}Repor a palavra-passe do Miven{{ end }}"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "{{ $l := or .Data.locale \"pt\" }}{{ if eq $l \"en\" }}Your Miven sign-in link{{ else if eq $l \"es\" }}Tu enlace para entrar en Miven{{ else }}O teu link para entrar no Miven{{ end }}"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "{{ $l := or .Data.locale \"pt\" }}{{ if eq $l \"en\" }}Confirm your new Miven email{{ else if eq $l \"es\" }}Confirma tu nuevo email de Miven{{ else }}Confirma o novo email do Miven{{ end }}"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "{{ $l := or .Data.locale \"pt\" }}{{ if eq $l \"en\" }}You've been invited to Miven{{ else if eq $l \"es\" }}Te han invitado a Miven{{ else }}Foste convidado para o Miven{{ end }}"
content_path = "./supabase/templates/invite.html"

# A função confirma a sessão com `auth.getUser()`; o JWT da plataforma bloqueia o OPTIONS da web.
# O CORS permitido está no código (origins locais + ALLOWED_WEB_ORIGINS). Não voltar a usar `*`.
[functions.delete-account]
verify_jwt = false

[functions.suggest-entry]
verify_jwt = false

# Staging. Aplicado com `npx supabase config push --remote=qlimqcgrgaqzwjmafora` (só staging).
# A web de desenvolvimento corre em localhost:8081; a app nativa usa o esquema miven://.
# O SMTP fica desligado até a chave do Resend existir no ambiente: ligá-lo sem ela quebra o envio.
[remotes.staging]
project_id = "qlimqcgrgaqzwjmafora"

[remotes.staging.auth]
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "miven://auth/callback",
  "miven://auth/reset-password",
  "http://localhost:8081/auth/callback",
  "http://localhost:8081/auth/reset-password",
  "https://miven.pt/auth/callback",
  "https://miven.pt/auth/reset-password",
  "https://www.miven.pt/auth/callback",
  "https://www.miven.pt/auth/reset-password",
]

[remotes.staging.auth.email.smtp]
enabled = false
