name: Email jobs (lifecycle cron)

on:
  schedule:
    # Cada hora — onboarding, inactividade, prazos, resumo dominical
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-email-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Supabase email-jobs
        env:
          SUPABASE_URL: https://oxhjfwmhcwadlltinlck.supabase.co
          EMAIL_CRON_SECRET: ${{ secrets.EMAIL_CRON_SECRET }}
        run: |
          if [ -z "$EMAIL_CRON_SECRET" ]; then
            echo "EMAIL_CRON_SECRET não definido nos GitHub Secrets — saltar."
            exit 0
          fi
          curl -sfS -X POST \
            "${SUPABASE_URL}/functions/v1/email-jobs" \
            -H "x-cron-secret: ${EMAIL_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}'
