# =============================================================================
# CentFlow — Release pipeline (OTA + IPA unsigned)
# =============================================================================
#
# Dispara automaticamente em push para main:
#   1. Valida package-lock (npm ci)
#   2. Publica EAS Update (preview + production)
#   3. Build IPA unsigned iOS (LiveContainer) — config beta real
#
# Manual: GitHub → Actions → "CentFlow Release" → Run workflow
#
# Secret obrigatório para OTA: EXPO_TOKEN
#   Criar em https://expo.dev/settings/access-tokens
#   Adicionar em GitHub → Settings → Secrets → Actions → EXPO_TOKEN
# =============================================================================

name: CentFlow Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_ota:
        description: 'Publicar EAS Update (preview + production)'
        type: boolean
        default: true
      build_ipa:
        description: 'Build IPA unsigned iOS (LiveContainer)'
        type: boolean
        default: true
  workflow_call:
    inputs:
      publish_ota:
        type: boolean
        default: true
      build_ipa:
        type: boolean
        default: true

concurrency:
  group: centflow-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  EXPO_NO_TELEMETRY: 1
  RCT_NO_LAUNCH_PACKAGER: 1
  # Alinhado com eas.json beta/preview — dados reais + Doctor activo
  EXPO_PUBLIC_APP_VARIANT: beta
  EXPO_PUBLIC_MOCK_AUTH: false
  EXPO_PUBLIC_USE_MOCK: false
  EXPO_PUBLIC_MOCK_OCR: false
  EXPO_PUBLIC_SUPABASE_URL: https://oxhjfwmhcwadlltinlck.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_nY3Bqe4UcgbtIteavz6H1Q_kgquHcDQ
  EAS_UPDATE_CHANNEL: preview
  EXPO_PUBLIC_EAS_UPDATE_CHANNEL: preview
  EXPO_PUBLIC_API_URL: https://api.centflow.app

jobs:
  validate:
    name: Validate lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify npm ci sync
        run: |
          set -euo pipefail
          node --version
          npm --version
          test -f package.json
          test -f package-lock.json
          node -e "JSON.parse(require('fs').readFileSync('package-lock.json','utf8'))"
          npm ci --dry-run --no-audit --fund=false

  ota:
    name: EAS Update (OTA)
    needs: validate
    continue-on-error: true
    if: >-
      github.event_name == 'push' ||
      (contains(fromJSON('["workflow_dispatch","workflow_call"]'), github.event_name) &&
       inputs.publish_ota != false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Prepare OTA message
        id: meta
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          SUBJECT="$(git log -1 --pretty=%s)"
          echo "message=Release ${SHORT_SHA}: ${SUBJECT}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Publish OTA — preview channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN em falta. Adiciona em GitHub → Settings → Secrets → Actions."
            exit 1
          fi
          npx eas-cli update \
            --channel preview \
            --environment preview \
            --non-interactive \
            --message "${{ steps.meta.outputs.message }}"

      - name: Publish OTA — production channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx eas-cli update \
            --channel production \
            --environment production \
            --non-interactive \
            --message "${{ steps.meta.outputs.message }}"

  build-ipa:
    name: Build unsigned .ipa (beta)
    needs: validate
    if: >-
      github.event_name == 'push' ||
      (contains(fromJSON('["workflow_dispatch","workflow_call"]'), github.event_name) &&
       inputs.build_ipa != false)
    runs-on: macos-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log release metadata
        run: |
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Subject: $(git log -1 --pretty=%s)"
          echo "Variant: ${EXPO_PUBLIC_APP_VARIANT}"
          echo "OTA channel: ${EAS_UPDATE_CHANNEL}"
          echo "Mock auth: ${EXPO_PUBLIC_MOCK_AUTH}"

      - name: Select Xcode 26 (Swift 6.2+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode and Swift versions
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci --no-audit --fund=false

      - name: Patch expo-modules-jsi for Xcode 26
        run: bash scripts/patch-expo-modules-jsi-xcode26.sh

      - name: Install Expo CLI
        run: npm install -g @expo/cli@latest

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Prepare iOS project for unsigned CI build
        run: bash scripts/ci-ios-unsigned-prep.sh

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          set -euo pipefail
          pod install --repo-update || {
            echo "::warning::pod install --repo-update falhou; a tentar pod install simples..."
            pod install
          }

      - name: Pre-build ExpoModulesJSI xcframework (device)
        env:
          PODS_ROOT: ${{ github.workspace }}/ios/Pods
          PLATFORM_NAME: iphoneos
          REACT_NATIVE_PATH: ${{ github.workspace }}/node_modules/react-native
        run: |
          set -euo pipefail
          bash node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh
          test -d node_modules/expo-modules-jsi/apple/Products/ExpoModulesJSI.xcframework

      - name: Resolve Xcode workspace and scheme
        id: xcode
        run: |
          set -euo pipefail

          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if [ -z "${WORKSPACE}" ]; then
            echo "::error::Nenhum .xcworkspace encontrado em ios/."
            exit 1
          fi

          PKG_SCHEME=$(node -e "
            const name = require('./package.json').name || 'app';
            const safe = name
              .replace(/[^a-zA-Z0-9._-]/g, '-')
              .replace(/^[^a-zA-Z]+/, 'app-');
            process.stdout.write(safe);
          ")

          SCHEMES_JSON=$(xcodebuild -list -json -workspace "${WORKSPACE}")
          SCHEMES=$(echo "${SCHEMES_JSON}" | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            process.stdout.write((data.workspace?.schemes || []).join('\n'));
          ")

          echo "Schemes: ${SCHEMES}"

          SCHEME=""
          if echo "${SCHEMES}" | grep -qx "${PKG_SCHEME}"; then
            SCHEME="${PKG_SCHEME}"
          fi
          if [ -z "${SCHEME}" ]; then
            SCHEME=$(echo "${SCHEMES}" | grep -i "${PKG_SCHEME}" | head -n 1 || true)
          fi
          if [ -z "${SCHEME}" ]; then
            EXPO_NAME=$(node -e "process.stdout.write(require('./app.json').expo.name || '')")
            SCHEME=$(echo "${SCHEMES}" | grep -i "${EXPO_NAME}" | head -n 1 || true)
          fi
          if [ -z "${SCHEME}" ]; then
            SCHEME=$(echo "${SCHEMES}" | grep -i "CentFlow" | head -n 1 || true)
          fi
          if [ -z "${SCHEME}" ]; then
            SCHEME=$(echo "${SCHEMES}" | head -n 1)
          fi
          if [ -z "${SCHEME}" ]; then
            echo "::error::Não foi possível determinar o Xcode scheme."
            exit 1
          fi

          echo "scheme=${SCHEME}" >> "${GITHUB_OUTPUT}"
          echo "workspace=${WORKSPACE}" >> "${GITHUB_OUTPUT}"
          echo "Usando scheme: ${SCHEME}"

      - name: Pre-bundle JavaScript (expo export embed)
        run: |
          set -euo pipefail
          export NODE_BINARY="$(command -v node)"
          npx expo export:embed --platform ios --dev false --eager --reset-cache

      - name: Xcode build Release (unsigned)
        id: xcodebuild
        run: |
          set -euo pipefail

          DERIVED="${RUNNER_TEMP}/DerivedData"
          mkdir -p "${DERIVED}"

          set +e
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${DERIVED}" \
            -xcconfig ios/CIUnsigned.xcconfig \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            ONLY_ACTIVE_ARCH=NO \
            -skipPackagePluginValidation \
            build 2>&1 | tee xcodebuild.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          echo "DERIVED=${DERIVED}" >> "${GITHUB_ENV}"

          if [ "${BUILD_EXIT}" -ne 0 ]; then
            echo "::error::xcodebuild falhou com exit code ${BUILD_EXIT}"
            grep -E "error:|fatal error:|Command .* failed" xcodebuild.log | tail -50 || true
            tail -80 xcodebuild.log || true
            exit "${BUILD_EXIT}"
          fi

      - name: Upload xcodebuild logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs-${{ github.run_number }}
          path: xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Export unsigned .ipa
        run: |
          set -euo pipefail

          APP_BUNDLE=$(find "${DERIVED}" -name "*.app" -path "*Release-iphoneos*" -print -quit)

          if [ -z "${APP_BUNDLE}" ]; then
            echo "::error::Nenhum .app Release-iphoneos encontrado em ${DERIVED}"
            find "${DERIVED}" -name "*.app" | head -20 || true
            exit 1
          fi

          SHORT_SHA="$(git rev-parse --short HEAD)"
          IPA_PATH="${RUNNER_TEMP}/CentFlow-beta-${SHORT_SHA}.ipa"

          PAYLOAD_DIR="${RUNNER_TEMP}/Payload"
          rm -rf "${PAYLOAD_DIR}"
          mkdir -p "${PAYLOAD_DIR}"
          cp -R "${APP_BUNDLE}" "${PAYLOAD_DIR}/"

          (cd "${RUNNER_TEMP}" && zip -qr "${IPA_PATH}" Payload)
          rm -rf "${PAYLOAD_DIR}"

          ls -lh "${IPA_PATH}"
          echo "IPA_PATH=${IPA_PATH}" >> "${GITHUB_ENV}"
          echo "commit=${SHORT_SHA}" >> "${GITHUB_ENV}"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CentFlow-beta-ipa-${{ github.sha }}
          path: ${{ env.IPA_PATH }}
          retention-days: 14
          if-no-files-found: error

  summary:
    name: Release summary
    needs: [validate, ota, build-ipa]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write job summary
        run: |
          {
            echo "## CentFlow Release — \`${{ github.sha }}\`"
            echo ""
            echo "| Job | Resultado |"
            echo "|-----|-----------|"
            echo "| Validate | ${{ needs.validate.result }} |"
            echo "| OTA | ${{ needs.ota.result }} |"
            echo "| IPA beta | ${{ needs.build-ipa.result }} |"
            echo ""
            if [ "${{ needs.ota.result }}" = "failure" ]; then
              echo "> **OTA falhou** — adiciona \`EXPO_TOKEN\` em Settings → Secrets → Actions e re-executa só o job OTA."
              echo "> OTA já foi publicado manualmente no commit \`9a49218\` (preview + production)."
            fi
            if [ "${{ needs.build-ipa.result }}" = "success" ]; then
              echo "> **IPA pronto** — descarrega o artefacto \`CentFlow-beta-ipa-${{ github.sha }}\` neste run."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
