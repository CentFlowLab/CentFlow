# Site estático de miven.pt (ADR-034): página inicial e páginas de retorno dos emails.
# Publica só a pasta site/ no GitHub Pages; não compila a app nem lê segredos.
name: Site miven.pt

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar site/
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter o código
        uses: actions/checkout@v5

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
