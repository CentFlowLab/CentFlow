# Site de miven.pt no GitHub Pages (ADR-034, ADR-037): página de apresentação, páginas de retorno
# dos emails e a app web em /app. Lê só as variáveis públicas de produção do EAS.
name: Site miven.pt

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Compilar a app web e publicar site/
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter o código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Configurar o EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Obter as variáveis públicas de produção
        shell: bash
        run: |
          eas env:pull production --non-interactive --path .env.local > /tmp/eas-env-pull.txt
          if grep -qiE '^[A-Z_]*(SERVICE_ROLE|SECRET)[A-Z_]*=' .env.local; then
            echo "As variáveis de produção incluem uma chave secreta."
            exit 1
          fi
          grep -q '^EXPO_PUBLIC_SUPABASE_URL=' .env.local

      - name: Endereço do Supabase para a página de confirmação
        shell: bash
        run: |
          url=$(grep '^EXPO_PUBLIC_SUPABASE_URL=' .env.local | head -n1 | cut -d= -f2- | tr -d '"' | sed 's#/*$##')
          if ! printf '%s' "$url" | grep -qE '^https://[a-z0-9.-]+$'; then
            echo "EXPO_PUBLIC_SUPABASE_URL inesperado."
            exit 1
          fi
          echo "window.MIVEN_AUTH = { supabaseUrl: '$url' };" > site/assets/auth-config.js

      - name: Exportar a app web para /app
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.experiments = { ...(app.expo.experiments ?? {}), baseUrl: '/app' };
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          EOF
          npx expo export --platform web --output-dir dist
          rm -f .env.local
          node scripts/prepare-web-app.mjs dist /app
          rm -rf site/app
          cp -r dist site/app

      - name: Versão da app na página de instalação
        shell: bash
        run: |
          version=$(node -p "require('./app.json').expo.version")
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Versão inesperada em app.json: $version"
            exit 1
          fi
          sed -i -E "s#<span data-app-version>[^<]*</span>#<span data-app-version>${version}</span>#" site/experimentar/index.html
          grep -q "<span data-app-version>${version}</span>" site/experimentar/index.html

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
