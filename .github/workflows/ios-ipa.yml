# IPA iOS sem assinatura, publicado numa Release e anunciado na fonte do SideStore.
# Não pede sessão Apple, não cria certificados nem perfis, e não envia para a App Store.
name: iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ios-ipa-sideload
  cancel-in-progress: false

jobs:
  ipa:
    name: Verificar e compilar IPA sem assinatura
    runs-on: macos-26
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Obter o código
        uses: actions/checkout@v5

      - name: Confirmar o Xcode
        shell: bash
        run: |
          version="$(xcodebuild -version | awk 'NR==1 { print $2 }')"
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 26 || (major === 26 && minor < 4)) {
              console.error("O Expo SDK 58 precisa de Xcode 26.4 ou mais recente. Encontrado: " + process.argv[1]);
              process.exit(1);
            }
            console.log("Xcode " + process.argv[1]);
          ' "$version"

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificações do projeto
        run: npm run check

      - name: Confirmar o Bundle Identifier
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const bundleId = app.expo?.ios?.bundleIdentifier;
          if (bundleId !== 'app.centflow.mobile') {
            console.error(
              'Bundle identifier iOS inesperado. Esperado app.centflow.mobile, encontrado: ' +
                (bundleId ?? '(em falta)'),
            );
            process.exit(1);
          }
          console.log('Bundle identifier aceite: ' + bundleId);
          EOF

      - name: Reservar a compilação seguinte
        id: build
        shell: bash
        run: |
          tags="$(gh release list --limit 500 --json tagName --jq '.[].tagName' | tr '\n' ' ')"
          plan="$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/sideload-source-cli.mjs plan "$tags")"
          printf '%s\n' "$plan" >> "$GITHUB_OUTPUT"
          marketing="$(printf '%s\n' "$plan" | sed -n 's/^marketing_version=//p')"
          build="$(printf '%s\n' "$plan" | sed -n 's/^build_number=//p')"
          if [ -z "$marketing" ] || [ -z "$build" ]; then
            echo "Não foi possível calcular a versão da compilação."
            exit 1
          fi
          printf 'MARKETING_VERSION=%s\nBUILD_NUMBER=%s\n' "$marketing" "$build" >> "$GITHUB_ENV"
          export MARKETING_VERSION="$marketing"
          export BUILD_NUMBER="$build"
          node <<'EOF'
          const fs = require('node:fs');
          if (!process.env.MARKETING_VERSION || !process.env.BUILD_NUMBER) {
            console.error('Versão em falta.');
            process.exit(1);
          }
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.ios = app.expo.ios ?? {};
          app.expo.version = process.env.MARKETING_VERSION;
          app.expo.ios.buildNumber = process.env.BUILD_NUMBER;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          EOF
          echo "Compilação ${build} da versão ${marketing}. O app.json só muda neste runner."

      - name: Confirmar EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "O secret EXPO_TOKEN não está configurado neste repositório."
            exit 1
          fi
          echo "EXPO_TOKEN está presente."

      - name: Configurar o EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Obter as variáveis públicas de produção
        shell: bash
        run: |
          eas env:pull production --non-interactive --path .env.local > /tmp/eas-env-pull.txt
          node <<'EOF'
          const fs = require('node:fs');
          const text = fs.readFileSync('.env.local', 'utf8');
          const names = text
            .split('\n')
            .map((line) => line.trim())
            .filter((line) => line && !line.startsWith('#'))
            .map((line) => line.split('=')[0]);
          const required = ['EXPO_PUBLIC_SUPABASE_URL', 'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY'];
          const missing = required.filter((name) => !names.includes(name));
          if (missing.length > 0) {
            console.error('Faltam variáveis de produção: ' + missing.join(', '));
            process.exit(1);
          }
          if (names.some((name) => /service_role/i.test(name))) {
            console.error('As variáveis de produção incluem service_role. Essa chave não pode entrar na aplicação.');
            process.exit(1);
          }
          console.log('Variáveis públicas de produção presentes: ' + required.join(', '));
          EOF

      - name: Gerar o projeto iOS
        shell: bash
        run: npx expo prebuild --platform ios --no-install

      - name: Desligar a assinatura e instalar CocoaPods
        shell: bash
        run: |
          ruby -e 'require "xcodeproj"' >/dev/null 2>&1 || gem install xcodeproj --no-document
          ruby <<'RUBY'
          require 'xcodeproj'

          def disable_signing(path)
            project = Xcodeproj::Project.open(path)
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings.delete('CODE_SIGN_ENTITLEMENTS')
                config.build_settings.delete('DEVELOPMENT_TEAM')
                config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
              end
            end
            project.save
          end

          Dir['ios/*.xcodeproj'].each { |path| disable_signing(path) }
          RUBY
          (cd ios && pod install)
          ruby <<'RUBY'
          require 'xcodeproj'

          def disable_signing(path)
            project = Xcodeproj::Project.open(path)
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
              end
            end
            project.save
          end

          Dir['ios/*.xcodeproj', 'ios/Pods/Pods.xcodeproj'].each { |path| disable_signing(path) }
          RUBY

      - name: Compilar para iPhone sem assinatura
        shell: bash
        run: |
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "O prebuild não criou um workspace iOS."
            exit 1
          fi
          if ! xcodebuild -workspace "$workspace" -list | grep -q 'CentFlow'; then
            echo "O scheme CentFlow não existe neste projeto."
            xcodebuild -workspace "$workspace" -list
            exit 1
          fi
          xcodebuild \
            -workspace "$workspace" \
            -scheme CentFlow \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Empacotar o IPA
        shell: bash
        run: |
          app="$(find "$RUNNER_TEMP/derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [ -z "$app" ]; then
            echo "A compilação não produziu uma aplicação para iPhone."
            exit 1
          fi
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          if [ "$bundle_id" != "app.centflow.mobile" ]; then
            echo "Bundle identifier inesperado no IPA: $bundle_id"
            exit 1
          fi
          short_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          if [ "$short_version" != "$MARKETING_VERSION" ] || [ "$bundle_version" != "$BUILD_NUMBER" ]; then
            echo "A aplicação ficou ${short_version} (${bundle_version}) e a fonte espera ${MARKETING_VERSION} (${BUILD_NUMBER})."
            exit 1
          fi
          if [ ! -x "$app/CentFlow" ]; then
            echo "O executável CentFlow não está na aplicação."
            exit 1
          fi
          if codesign -d "$app" >/dev/null 2>&1; then
            echo "A aplicação ficou assinada. Este workflow só pode publicar um IPA sem assinatura."
            exit 1
          fi
          if find "$app" -name '*.appex' -print -quit | grep -q .; then
            echo "A aplicação contém uma extensão. Este empacotamento não a assina nem a valida."
            exit 1
          fi
          while IFS= read -r -d '' signature; do
            rm -rf "$signature"
          done < <(find "$app" -name '_CodeSignature' -type d -print0)
          find "$app" -name 'embedded.mobileprovision' -delete
          find "$app" -name '*.entitlements' -delete
          stage="$RUNNER_TEMP/ipa-stage"
          rm -rf "$stage"
          mkdir -p "$stage/Payload"
          ditto "$app" "$stage/Payload/$(basename "$app")"
          ditto -c -k --keepParent "$stage/Payload" "$RUNNER_TEMP/centflow-unsigned.ipa"
          rm -f .env.local
          if unzip -l "$RUNNER_TEMP/centflow-unsigned.ipa" | grep -E '(^|/)(\.env|\.env\.local|embedded\.mobileprovision)($|/)' ; then
            echo "O IPA contém ficheiros de ambiente ou um perfil de provisionamento."
            exit 1
          fi
          echo "IPA sem assinatura criado para $bundle_id."
          {
            echo "### IPA sem assinatura"
            echo
            echo "Artefacto \`centflow-sideload-ipa\`, ficheiro \`centflow-unsigned.ipa\`."
            echo
            echo "Bundle Identifier: \`$bundle_id\`. Versão \`$short_version\` (\`$bundle_version\`)."
            echo
            echo "Não foi enviado para a App Store nem para o TestFlight."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apagar variáveis locais
        if: always()
        shell: bash
        run: rm -f .env.local

      - name: Publicar a Release
        shell: bash
        run: |
          tag="sideload-build-${BUILD_NUMBER}"
          gh release create "$tag" \
            --title "CentFlow ${MARKETING_VERSION} (${BUILD_NUMBER})" \
            --notes "Compilação ${BUILD_NUMBER} da versão ${MARKETING_VERSION}. O identificador continua app.centflow.mobile, por isso atualizar por cima da instalação existente mantém a base de dados SQLite. Apagar a app e voltar a instalá-la remove esses dados. O SideStore mostra o botão de atualizar e pede confirmação; não instala sozinho. Este IPA não está assinado." \
            "$RUNNER_TEMP/centflow-unsigned.ipa#centflow-unsigned.ipa"

      - name: Atualizar a fonte do SideStore
        shell: bash
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/sideload-source-cli.mjs record \
            "$RUNNER_TEMP/centflow-unsigned.ipa" \
            "$MARKETING_VERSION" \
            "$BUILD_NUMBER" \
            "$(date -u +%Y-%m-%d)"
          git checkout -- app.json
          git add -- sideload/source.json
          if [ "$(git diff --cached --name-only)" != "sideload/source.json" ]; then
            echo "A publicação tentou incluir outros ficheiros."
            git diff --cached --name-only
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "ci: publish sideload ${MARKETING_VERSION} (${BUILD_NUMBER})"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          url='https://raw.githubusercontent.com/CentFlowLab/CentFlow/master/sideload/source.json'
          link="sidestore://source?url=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$url")"
          {
            echo "### Fonte SideStore"
            echo
            echo "URL: $url"
            echo
            echo "Adicionar no SideStore: \`$link\`"
            echo
            echo "O botão de atualizar compara a versão instalada com a primeira entrada de \`versions\`. Não instala sozinho."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar o IPA
        uses: actions/upload-artifact@v4
        with:
          name: centflow-sideload-ipa
          path: ${{ runner.temp }}/centflow-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
