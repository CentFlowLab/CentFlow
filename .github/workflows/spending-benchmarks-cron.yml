name: Spending benchmarks (cron)

on:
  schedule:
    # Semanal — agregados anonimizados (requer escala de utilizadores opt-in)
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  run-spending-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Supabase spending-benchmarks aggregate
        env:
          SUPABASE_URL: https://oxhjfwmhcwadlltinlck.supabase.co
          EMAIL_CRON_SECRET: ${{ secrets.EMAIL_CRON_SECRET }}
        run: |
          if [ -z "$EMAIL_CRON_SECRET" ]; then
            echo "EMAIL_CRON_SECRET não definido nos GitHub Secrets — saltar."
            exit 0
          fi
          curl -sfS -X POST \
            "${SUPABASE_URL}/functions/v1/spending-benchmarks" \
            -H "x-cron-secret: ${EMAIL_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"action":"aggregate"}'
