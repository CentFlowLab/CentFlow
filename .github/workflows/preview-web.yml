# Pré-visualização da web contra o staging (docs/ambientes.md). Corre em cada pull request e à mão.
# Não publica em miven.pt: o resultado é um artefacto para descarregar e abrir com
# `npm run serve:web`. Usa só as variáveis públicas do ambiente EAS `preview` (staging).
name: Preview web

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Verificar e compilar a web de teste
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificações do projeto
        run: npm run check

      - name: Configurar o EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Obter as variáveis públicas do staging
        shell: bash
        run: |
          eas env:pull preview --non-interactive --path .env.local > /tmp/eas-env-pull.txt
          if grep -qiE '^[A-Z_]*(SERVICE_ROLE|SECRET)[A-Z_]*=' .env.local; then
            echo "As variáveis de teste incluem uma chave secreta."
            exit 1
          fi
          url=$(grep '^EXPO_PUBLIC_SUPABASE_URL=' .env.local | head -n1 | cut -d= -f2- | tr -d '"')
          case "$url" in
            *qlimqcgrgaqzwjmafora*) echo "Staging." ;;
            *) echo "O ambiente preview não aponta para o staging."; exit 1 ;;
          esac

      - name: Exportar a web
        env:
          APP_VARIANT: preview
        run: |
          npx expo export --platform web --output-dir dist
          rm -f .env.local

      - name: Guardar o artefacto
        uses: actions/upload-artifact@v4
        with:
          name: miven-web-preview-${{ github.sha }}
          path: dist
          retention-days: 14
