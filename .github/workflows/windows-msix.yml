# Miven para Windows (docs/windows.md): pacote MSIX e instalador .exe, só como artefactos.
# Nunca submete à Microsoft Store. O MSIX de teste é assinado com um certificado descartável
# criado nesta execução (o .cer vem junto, para confiar nele no PC de teste). Para a Store, a
# Microsoft volta a assinar o pacote na submissão.
name: Windows MSIX

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente (production = Miven contra a produção; preview = Miven Teste contra o staging)
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

jobs:
  windows:
    name: Compilar MSIX e instalador
    runs-on: windows-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Verificações do projeto
        run: npm run check

      - name: Configurar o EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Obter as variáveis públicas
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "preview" ]; then file=.env.staging; else file=.env.local; fi
          eas env:pull "${{ inputs.environment }}" --non-interactive --path "$file" > /tmp/eas-env-pull.txt
          if grep -qiE '^[A-Z_]*(SERVICE_ROLE|SECRET)[A-Z_]*=' "$file"; then
            echo "As variáveis incluem uma chave secreta."
            exit 1
          fi

      - name: Exportar a web e os ícones
        shell: bash
        run: |
          cd desktop
          if [ "${{ inputs.environment }}" = "production" ]; then node scripts/build-web.mjs --production; else node scripts/build-web.mjs; fi
          node scripts/make-assets.mjs
          rm -f ../.env.local ../.env.staging

      - name: Certificado de teste descartável
        shell: pwsh
        run: |
          $password = [Convert]::ToBase64String((1..24 | ForEach-Object { Get-Random -Maximum 256 }))
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Miven Teste' -KeyUsage DigitalSignature `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}') `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(2)
          New-Item -ItemType Directory -Force desktop\cert | Out-Null
          Export-PfxCertificate -Cert $cert -FilePath desktop\cert\miven-teste.pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath desktop\cert\miven-teste.cer | Out-Null
          "WIN_CSC_LINK=$PWD\desktop\cert\miven-teste.pfx" >> $env:GITHUB_ENV
          "WIN_CSC_KEY_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Compilar
        working-directory: desktop
        run: npx electron-builder --win appx nsis

      - name: Guardar os artefactos
        uses: actions/upload-artifact@v4
        with:
          name: miven-windows-${{ inputs.environment }}-${{ github.sha }}
          path: |
            desktop/release/*.appx
            desktop/release/*.exe
            desktop/cert/miven-teste.cer
          retention-days: 30
