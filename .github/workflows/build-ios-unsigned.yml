# =============================================================================
# CentFlow — Build iOS unsigned .ipa (LiveContainer)
# =============================================================================

name: Build iOS unsigned IPA

on:
  workflow_dispatch:

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  EXPO_NO_TELEMETRY: 1
  RCT_NO_LAUNCH_PACKAGER: 1
  EXPO_PUBLIC_API_URL: https://api.centflow.app
  EXPO_PUBLIC_MOCK_AUTH: "false"

jobs:
  build-ipa:
    name: Build unsigned .ipa
    runs-on: macos-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Expo SDK 56 / expo-modules-jsi exige Swift 6.2+ (Package.swift tools-version 6.2)
      # O default do runner é Xcode 16.4 (Swift 6.1) → falha ExpoModulesJSI
      - name: Select Xcode 26 (Swift 6.2+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode and Swift versions
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Patch expo-modules-jsi for Xcode 26
        run: bash scripts/patch-expo-modules-jsi-xcode26.sh

      - name: Install Expo CLI
        run: npm install -g @expo/cli@latest

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Prepare iOS project for unsigned CI build
        run: bash scripts/ci-ios-unsigned-prep.sh

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          set -euo pipefail
          pod install --repo-update || {
            echo "::warning::pod install --repo-update falhou; a tentar pod install simples..."
            pod install
          }

      - name: Pre-build ExpoModulesJSI xcframework (device)
        env:
          PODS_ROOT: ${{ github.workspace }}/ios/Pods
          PLATFORM_NAME: iphoneos
          REACT_NATIVE_PATH: ${{ github.workspace }}/node_modules/react-native
        run: |
          set -euo pipefail
          bash node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh
          test -d node_modules/expo-modules-jsi/apple/Products/ExpoModulesJSI.xcframework

      - name: Resolve Xcode workspace and scheme
        id: xcode
        run: |
          set -euo pipefail

          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if [ -z "${WORKSPACE}" ]; then
            echo "::error::Nenhum .xcworkspace encontrado em ios/."
            exit 1
          fi

          PKG_SCHEME=$(node -e "
            const name = require('./package.json').name || 'app';
            const safe = name
              .replace(/[^a-zA-Z0-9._-]/g, '-')
              .replace(/^[^a-zA-Z]+/, 'app-');
            process.stdout.write(safe);
          ")

          SCHEMES_JSON=$(xcodebuild -list -json -workspace "${WORKSPACE}")
          SCHEMES=$(echo "${SCHEMES_JSON}" | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            process.stdout.write((data.workspace?.schemes || []).join('\n'));
          ")

          echo "Schemes: ${SCHEMES}"

          SCHEME=""
          if echo "${SCHEMES}" | grep -qx "${PKG_SCHEME}"; then
            SCHEME="${PKG_SCHEME}"
          fi
          if [ -z "${SCHEME}" ]; then
            SCHEME=$(echo "${SCHEMES}" | grep -i "${PKG_SCHEME}" | head -n 1 || true)
          fi
          if [ -z "${SCHEME}" ]; then
            EXPO_NAME=$(node -e "process.stdout.write(require('./app.json').expo.name || '')")
            SCHEME=$(echo "${SCHEMES}" | grep -i "${EXPO_NAME}" | head -n 1 || true)
          fi
          if [ -z "${SCHEME}" ]; then
            SCHEME=$(echo "${SCHEMES}" | head -n 1)
          fi
          if [ -z "${SCHEME}" ]; then
            echo "::error::Não foi possível determinar o Xcode scheme."
            exit 1
          fi

          echo "scheme=${SCHEME}" >> "${GITHUB_OUTPUT}"
          echo "workspace=${WORKSPACE}" >> "${GITHUB_OUTPUT}"
          echo "Usando scheme: ${SCHEME}"

      - name: Pre-bundle JavaScript (expo export embed)
        run: |
          set -euo pipefail
          export NODE_BINARY="$(command -v node)"
          # --eager infere bundle-output/assets-dest (obrigatório sem --eager)
          npx expo export:embed --platform ios --dev false --eager --reset-cache

      - name: Xcode build Release (unsigned)
        id: xcodebuild
        run: |
          set -euo pipefail

          DERIVED="${RUNNER_TEMP}/DerivedData"
          mkdir -p "${DERIVED}"

          set +e
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${DERIVED}" \
            -xcconfig ios/CIUnsigned.xcconfig \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            ONLY_ACTIVE_ARCH=NO \
            -skipPackagePluginValidation \
            build 2>&1 | tee xcodebuild.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          echo "DERIVED=${DERIVED}" >> "${GITHUB_ENV}"

          if [ "${BUILD_EXIT}" -ne 0 ]; then
            echo "::error::xcodebuild falhou com exit code ${BUILD_EXIT}"
            echo "=== Últimos erros ==="
            grep -E "error:|fatal error:|Command .* failed" xcodebuild.log | tail -50 || true
            echo "=== Últimas 80 linhas ==="
            tail -80 xcodebuild.log || true
            exit "${BUILD_EXIT}"
          fi

      - name: Upload xcodebuild logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Export unsigned .ipa
        run: |
          set -euo pipefail

          APP_BUNDLE=$(find "${DERIVED}" -name "*.app" -path "*Release-iphoneos*" -print -quit)

          if [ -z "${APP_BUNDLE}" ]; then
            echo "::error::Nenhum .app Release-iphoneos encontrado em ${DERIVED}"
            find "${DERIVED}" -name "*.app" | head -20 || true
            exit 1
          fi

          echo "App bundle: ${APP_BUNDLE}"

          PAYLOAD_DIR="${RUNNER_TEMP}/Payload"
          IPA_PATH="${RUNNER_TEMP}/CentFlow-unsigned.ipa"

          rm -rf "${PAYLOAD_DIR}"
          mkdir -p "${PAYLOAD_DIR}"
          cp -R "${APP_BUNDLE}" "${PAYLOAD_DIR}/"

          (cd "${RUNNER_TEMP}" && zip -qr "${IPA_PATH}" Payload)
          rm -rf "${PAYLOAD_DIR}"

          ls -lh "${IPA_PATH}"
          echo "IPA_PATH=${IPA_PATH}" >> "${GITHUB_ENV}"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CentFlow-unsigned-ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 14
          if-no-files-found: error
