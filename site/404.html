<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Miven</title>
    <link rel="icon" href="/favicon.png" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101b2d" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="/assets/home.css" />
    <script>
      // A app web (SPA) vive em /app: um link profundo chega aqui; guarda o caminho e abre a app.
      (function () {
        var path = window.location.pathname;
        if (path.indexOf('/app/') === 0 && path !== '/app/') {
          try {
            sessionStorage.setItem(
              'miven:spa-path',
              path + window.location.search + window.location.hash,
            );
          } catch (e) {}
          window.location.replace('/app/');
        }
      })();
    </script>
  </head>
  <body class="home status-page">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="Miven, página inicial">
          <picture>
            <source type="image/webp" srcset="/assets/logo-56.webp 2x, /assets/logo-84.webp 3x" />
            <img
              src="/assets/logo-56.png"
              srcset="/assets/logo-56.png 2x, /assets/logo-84.png 3x"
              width="28"
              height="28"
              alt="" />
          </picture>
          <span>Miven</span>
        </a>
      </div>
    </header>
    <main class="status-main">
      <section class="card">
        <h1>Página não encontrada</h1>
        <p>Este endereço não existe.</p>
        <a class="button" href="/">Voltar ao início</a>
      </section>
    </main>
  </body>
</html>
